name: Deploy ZUNON to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify identity signatures
        run: node --test tests/identity.test.mjs
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: Test wallet flows and responsive layout
        run: npx playwright test
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
      - name: Check custom-domain asset paths
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html = fs.readFileSync('dist/index.html', 'utf8'); if (!html.includes('src=\"/assets/') || html.includes('/xx/assets/')) throw new Error('Incorrect custom-domain asset base');"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Wait for any default Pages source publication
        uses: actions/github-script@v7
        with:
          script: |
            // A repository configured for branch publishing can start a second
            // Pages run for the same commit. Publish our Vite artifact last.
            const started = Date.now()
            let complete = false
            while (Date.now() - started < 300000) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                head_sha: context.sha,
                per_page: 100
              })
              const sourceRuns = data.workflow_runs.filter(run =>
                run.id !== context.runId &&
                (run.path === 'dynamic/pages/pages-build-deployment' ||
                 run.name === 'pages build and deployment'))
              if (sourceRuns.length && sourceRuns.every(run => run.status === 'completed')) {
                complete = true
                break
              }
              if (!sourceRuns.length && Date.now() - started > 30000) {
                complete = true
                break
              }
              await new Promise(resolve => setTimeout(resolve, 10000))
            }
            if (!complete) throw new Error('Default Pages publication is still running; retry deployment after it finishes.')
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
