name: Diagnose public website
on:
  push:
    paths: ['.github/workflows/site-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Pages settings
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages', context.repo)
              console.log(JSON.stringify({cname:data.cname,build_type:data.build_type,status:data.status,https_enforced:data.https_enforced,html_url:data.html_url,https_certificate:data.https_certificate}))
            } catch (error) { console.log('PAGES_SETTINGS_ERROR', error.message) }
      - name: Check public DNS, TLS and resources
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['zunon.run','www.zunon.run']) {
            for (const type of ['A','AAAA','CNAME','NS']) {
              try {
                const r=await fetch('https://dns.google/resolve?name='+name+'&type='+type,{signal:AbortSignal.timeout(10000)})
                const d=await r.json()
                console.log('DNS',name,type,JSON.stringify({status:d.Status,answer:d.Answer,authority:d.Authority}))
              } catch(e) { console.log('DNS_ERROR',name,type,e.message,e.cause?.message) }
            }
          }
          for (const url of ['http://zunon.run/','https://zunon.run/','https://www.zunon.run/','https://ghostxrun.github.io/xx/']) {
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(15000),redirect:'follow'})
              const html=await response.text()
              console.log('SITE',JSON.stringify({url,final:response.url,status:response.status,type:response.headers.get('content-type'),title:html.match(/<title>(.*?)<\/title>/)?.[1],html:html.slice(0,900)}))
              const assets=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m=>new URL(m[1],response.url).href)
              for (const asset of assets.slice(0,4)) {
                const result=await fetch(asset,{signal:AbortSignal.timeout(10000)})
                console.log('ASSET',asset,result.status,result.headers.get('content-type'))
              }
            } catch(e) { console.log('SITE_ERROR',url,e.message,e.cause?.code,e.cause?.message) }
          }
          NODE
